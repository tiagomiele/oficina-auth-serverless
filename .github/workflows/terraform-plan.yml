name: Terraform plan

on:
  pull_request:
    branches: [main, homolog]
    paths:
      - '.github/workflows/terraform-plan.yml'
      - '.mvn/**'
      - 'environments/**'
      - 'scripts/**'
      - 'src/**'
      - '*.tf'
      - '.terraform.lock.hcl'
      - 'mvnw'
      - 'pom.xml'

concurrency:
  group: terraform-plan-${{ github.base_ref == 'main' && 'production' || 'homolog' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan (${{ github.base_ref == 'main' && 'production' || 'homolog' }})
    runs-on: ubuntu-latest
    environment: ${{ github.base_ref == 'main' && 'production-plan' || 'homolog-plan' }}
    permissions:
      contents: read
    env:
      TARGET_ENVIRONMENT: ${{ github.base_ref == 'main' && 'production' || 'homolog' }}
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      TF_WORKSPACE: ${{ github.base_ref == 'main' && vars.TF_WORKSPACE_PRODUCTION || vars.TF_WORKSPACE_HOMOLOG }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Package Lambda artifact
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests package spotless:check

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Validate HCP configuration
        run: |
          set -euo pipefail
          test -n "$TF_CLOUD_ORGANIZATION" || { echo "::error::TF_CLOUD_ORGANIZATION não configurada no ambiente de plan."; exit 1; }
          test -n "$TF_WORKSPACE" || { echo "::error::Workspace HCP de $TARGET_ENVIRONMENT não configurado no ambiente de plan."; exit 1; }

      - name: Terraform init
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color 2>&1 | tee /tmp/terraform-plan.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          if grep -Eq 'ExpiredToken|security token included in the request is expired' /tmp/terraform-plan.log; then
            echo '::warning::Plan remoto ignorado porque a sessão AWS Academy do workspace expirou.'
            {
              echo '## Plan não executado'
              echo
              echo '- motivo: sessão AWS Academy expirada no workspace HCP Terraform'
              echo '- ação: renovar as credenciais antes do próximo deploy'
            } >> "$GITHUB_STEP_SUMMARY"
            echo 'skipped=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          exit "$status"

      - name: Summary
        if: steps.plan.outputs.skipped != 'true'
        run: |
          {
            echo "## Plan de ${TARGET_ENVIRONMENT}"
            echo
            echo "- workspace: \`${TF_WORKSPACE}\`"
            echo "- nenhum apply executado"
          } >> "$GITHUB_STEP_SUMMARY"
